# Render Blueprint: one public game server on Render's free plan.
# In Render: New > Blueprint, pick this repo. See "Hosting it for everyone" in README.md.
services:
  - type: web
    name: friendslop
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: node server/start.js
    healthCheckPath: /api/health
    domains:
      - play.friendslop.us
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render sends traffic to the PORT it sets; listen on every interface to receive it.
      - key: HOST
        value: 0.0.0.0
      # The service's onrender.com name, as Render's dashboard shows it, and the custom domain.
      - key: ALLOWED_HOSTS
        value: play.friendslop.us,friendslop-2c4h.onrender.com
      # Render's proxy puts the player's address first in X-Forwarded-For.
      - key: TRUST_PROXY
        value: "1"
      # This server runs no game code. Games come from GitHub links, run in the players' browsers,
      # and the server only relays them (see "Games shared by link" in README.md). GAMES_DIR points
      # at a folder that must stay empty, so a game committed to games/ never runs here.
      - key: GAMES_DIR
        value: server/no-games
      # Public-server limits (see the config table in README.md).
      - key: MAX_ROOMS
        value: "20"
      - key: ROOM_CREATES_PER_MINUTE
        value: "3"
      - key: MAX_CONNECTIONS_PER_IP
        value: "8"
      - key: MAX_CONNECTIONS
        value: "100"
      - key: ROOM_IDLE_MS
        value: "1800000"
      # About 4.5 GB a month. Raise it once Render's dashboard shows the plan's real allowance.
      - key: DAILY_TRAFFIC_MB
        value: "150"
